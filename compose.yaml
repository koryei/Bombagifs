services:
  bombagif:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./status.config:/app/status.config:ro
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
